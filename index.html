<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Your own radio for game soundtracks, anime openings and film &amp; TV scores, shuffled your way. No account, no ads." />
    <!-- Link previews (Discord, Slack, iMessage, X, …). Scrapers need absolute URLs: the MEDLEY_SITE placeholder
         is the site's public address (vite.config.ts), or "/" for a local build. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Medley" />
    <meta property="og:title" content="Medley: every story has a sound" />
    <meta property="og:description" content="Your own radio for game soundtracks, anime openings and film &amp; TV scores, shuffled your way. No account, no ads." />
    <meta property="og:url" content="%MEDLEY_SITE%" />
    <meta property="og:image" content="%MEDLEY_SITE%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Medley: Every story has a sound. Covers of Hollow Knight, Celeste, Frieren, Your Name and Attack on Titan." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- YouTube's embedded player needs to know which site embeds it (it rejects requests
         without a Referer). This keeps the origin, never full URLs, on cross-site requests. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#14111d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Medley</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
