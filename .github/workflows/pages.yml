# Publishes the GitHub Pages preview: Medley without its server (src/lib/preview.ts), with a
# demo library to play. Every push to main rebuilds it; the local app is unaffected.
name: Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The repo's name is the site's base path (https://<owner>.github.io/<repo>/).
      - run: npm run build:pages
        env:
          MEDLEY_PAGES_BASE: /${{ github.event.repository.name }}/
          # Link previews need the absolute address (og:image, og:url).
          MEDLEY_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
