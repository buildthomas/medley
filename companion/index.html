<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https: http: data:; font-src 'self'"
    />
    <title>Medley</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <!-- Now playing -->
      <main id="player" hidden>
        <div class="cover" id="cover" title="Open Medley"><span id="cover-letter"></span></div>
        <div class="info">
          <div class="work" id="work"></div>
          <div class="title" id="title"></div>
          <div class="sub" id="sub"></div>
          <div class="bar"><div id="bar-fill"></div></div>
          <div class="controls">
            <button id="prev" title="Previous (←)">⏮</button>
            <button id="toggle" class="play" title="Play/pause (Space)">▶</button>
            <button id="next" title="Next (→)">⏭</button>
            <button id="like" title="Like (L)">♡</button>
            <span class="time" id="time"></span>
          </div>
        </div>
      </main>

      <!-- Not connected yet / waiting -->
      <section id="message" class="message" hidden>
        <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div>
          <div class="headline" id="headline"></div>
          <div class="detail" id="detail"></div>
        </div>
      </section>

      <form id="setup" class="setup" hidden>
        <div class="headline">Connect to Medley</div>
        <div class="detail">In Medley: <b>Add link → Desktop companion</b>, turn it on, copy the code.</div>
        <div class="row">
          <input id="code" placeholder="http://localhost:5173#…" spellcheck="false" autocomplete="off" />
          <button type="submit" class="primary">Connect</button>
        </div>
        <div class="detail err" id="setup-error"></div>
      </form>

      <nav class="window" aria-label="Window">
        <button id="pin" title="Keep on top">📌</button>
        <button id="settings" title="Connection">⚙</button>
        <button id="min" title="Minimize">–</button>
        <button id="close" title="Quit">✕</button>
      </nav>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
